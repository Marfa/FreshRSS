name: Build and deploy feeds

# Image is built on GitHub runners and pushed to GHCR.
# VPS pulls the image and blue-green reloads (idle slot → nginx switch → stop old).

on:
  push:
    branches: [edge]
  workflow_dispatch:

concurrency:
  group: deploy-feeds
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/marfa/freshrss
  DEPLOY_DIR: /opt/freshrss

jobs:
  build:
    name: Build GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get FreshRSS version
        run: |
          FRESHRSS_VERSION=$(sed -n "s/^const FRESHRSS_VERSION = '\(.*\)'.*$/\1/p" constants.php)
          echo "FRESHRSS_VERSION=$FRESHRSS_VERSION" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/edge' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRESHRSS_VERSION=${{ env.FRESHRSS_VERSION }}
            SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public (anonymous pull on VPS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/freshrss/visibility" \
            -f visibility=public

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy assets
        uses: actions/checkout@v7

      - name: Upload compose and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deploy/docker-compose.yml,deploy/blue-green-deploy.sh"
          target: /tmp/freshrss-deploy
          strip_components: 1

      - name: Pull image and blue-green reload
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GHCR_TOKEN,GHCR_USER
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            DEPLOY_DIR=/opt/freshrss
            mkdir -p "$DEPLOY_DIR"
            install -m 0644 /tmp/freshrss-deploy/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
            install -m 0755 /tmp/freshrss-deploy/blue-green-deploy.sh "$DEPLOY_DIR/blue-green-deploy.sh"
            touch "$DEPLOY_DIR/.env"

            # nginx snippets (ytcdn, upstream) are managed on the VPS — not overwritten each deploy
            if ! grep -Rqs 'freshrss-upstream.conf' /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ 2>/dev/null; then
              echo "⚠️  missing include snippets/freshrss-upstream.conf in nginx site" >&2
            fi

            cd "$DEPLOY_DIR"
            DEPLOY_DIR="$DEPLOY_DIR" IMAGE=ghcr.io/marfa/freshrss:edge ./blue-green-deploy.sh
