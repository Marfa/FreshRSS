# YouTube thumbnail CDN proxy for FreshRSS clients that cannot reach *.ytimg.com
# Used by xExtension-YtThumbProxy (rewrites i*.ytimg.com / img.youtube.com -> /ytcdn/...)
# Requires in http{}: proxy_cache_path ... keys_zone=freshrss_img:...

# Shared proxy_cache settings for all ytcdn locations
# (included via identical directives — nginx has no location inheritance)

location /ytcdn/i/vi/ {
    proxy_pass https://i.ytimg.com/vi/;
    proxy_ssl_server_name on;
    proxy_set_header Host i.ytimg.com;
    proxy_set_header Referer https://www.youtube.com/;
    proxy_hide_header Set-Cookie;
    proxy_cache freshrss_img;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1h;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin *;
    expires 7d;
}
