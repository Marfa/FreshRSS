# YouTube thumbnail CDN proxy for FreshRSS clients that cannot reach *.ytimg.com
# Used by xExtension-YtThumbProxy (rewrites i*.ytimg.com / img.youtube.com -> /ytcdn/...)

location /ytcdn/i/vi/ {
    proxy_pass https://i.ytimg.com/vi/;
    proxy_ssl_server_name on;
    proxy_set_header Host i.ytimg.com;
    proxy_set_header Referer https://www.youtube.com/;
    proxy_hide_header Set-Cookie;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin *;
    expires 1d;
}
